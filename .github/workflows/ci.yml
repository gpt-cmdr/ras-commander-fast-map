name: Engine CI
# Every job runs on CLB's self-hosted runners only; there is no GitHub-hosted runner or
# fallback. Pull requests from forks do not run (untrusted code never reaches a CLB
# runner); a maintainer re-runs them from a branch in this repository. release.yml
# calls this workflow (workflow_call) for its qualified build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

env:
  FAST_MAP_BUILD_COMMIT: ${{ github.sha }}

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clb-ci-linux]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/verify_sources.py
      - run: python scripts/dependency_notices.py --check
      - run: python -m unittest discover -s scripts -p test_sanitize_wheel_sbom.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo test --locked --all-targets
      # Thread budget measured on the optimized executable, as shipped.
      - run: cargo test --release --locked --test thread_budget -- --nocapture
      - run: cargo publish --locked --dry-run
  wheels:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Windows, X64, clb-ci-windows]
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          # manylinux_2_28 without Docker: maturin links through zig against glibc 2.28
          # and checks the wheel's manylinux compliance itself.
          - runner: [self-hosted, Linux, X64, clb-ci-linux]
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # maturin from pip, not maturin-action: on the self-hosted Windows image the action
      # calls `rustc +<toolchain>`, which needs the rustup proxies the image lacks
      # (CARGO_HOME=C:\rust\cargo), and it unpacks with Windows PowerShell 5.1; on Linux it
      # needs Docker for manylinux. Same maturin version, toolchain and arguments.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Put the toolchain's cargo on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo_exe="$(rustup which cargo)"
          cargo_exe="${cargo_exe//\\//}"
          echo "${cargo_exe%/*}" >> "$GITHUB_PATH"
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install maturin==1.15.0
          python -m maturin build --release --locked --out dist-unsanitized --target "${{ matrix.target }}"
      - name: Build wheel (Linux, manylinux_2_28 through zig)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install maturin==1.15.0 ziglang==0.15.2
          python -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"
          export PATH="$(python -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))"):$PATH"
          python -m maturin build --release --locked --out dist-unsanitized --target "${{ matrix.target }}" \
            --zig --compatibility manylinux_2_28
      # The rust job measures the optimized executable's thread budget on Linux;
      # this measures it on Windows.
      - name: Thread budget tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --release --locked --test thread_budget --target "${{ matrix.target }}" -- --nocapture
      - name: Canonicalize SBOM workspace identities and verify wheel integrity
        run: python scripts/sanitize_wheel_sbom.py --input-dir dist-unsanitized --output-dir dist
      - name: Installed wheel smoke and source identity
        shell: bash
        run: |
          python -m pip install --no-deps --no-index --find-links dist ras-commander-fast-map
          python -m pip install numpy==2.3.5 scipy==1.16.3 rasterio==1.4.4
          python tests/smoke_engine_wheel.py
          python .github/scripts/artifact_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
