name: Native preparation (fast-map-prepare)

# fmt, clippy, tests and a locked release build of prepare/ against GEOS 3.13.1
# (the release shapely 2.1.2 carries), on the CLB self-hosted Linux runner only.
# GEOS comes from conda-forge through micromamba, as fim-commander's
# fim-conflation CI does. The artifact is the Linux binary with the GEOS 3.13.1
# shared libraries it was tested against (the binary finds them next to itself).

on:
  push:
    paths: ["prepare/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/prepare.yml"]
  pull_request:
    paths: ["prepare/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/prepare.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: prepare

jobs:
  prepare:
    # Pull requests from forks do not run here (no hosted fallback).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clb-ci-linux]
    timeout-minutes: 45
    env:
      GEOS_ROOT: ${{ github.workspace }}/.geos
      GEOS_VERSION: "3.13.1"
      # The conda-forge build the parity evidence used, and micromamba by checksum.
      GEOS_SPEC: "geos=3.13.1=h97f6797_0"
      # The C++ runtime shipped beside the binary, pinned to the builds of the parity run.
      RUNTIME_SPECS: "libstdcxx=16.2.0=h934c35e_7 libgcc=16.2.0=ha9f2e26_7 libgomp=16.2.0=he0feb66_7 _openmp_mutex=4.5=20_gnu"
      MICROMAMBA_SHA256: "9a97976244929bbae28fb1fae504e74a3e7e6d1932870e3a03321f01b7fbd07b"
      CARGO_TERM_COLOR: never
      FAST_MAP_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - name: GEOS 3.13.1 from conda-forge
        run: |
          set -euo pipefail
          mkdir -p "$GEOS_ROOT"
          curl -fsSL -o "$GEOS_ROOT/micromamba.tar.bz2" https://micro.mamba.pm/api/micromamba/linux-64/2.10.0
          echo "$MICROMAMBA_SHA256  $GEOS_ROOT/micromamba.tar.bz2" | sha256sum -c -
          tar -xjf "$GEOS_ROOT/micromamba.tar.bz2" -C "$GEOS_ROOT" bin/micromamba
          MAMBA_ROOT_PREFIX="$GEOS_ROOT/root" "$GEOS_ROOT/bin/micromamba" create -y \
            -p "$GEOS_ROOT/geos" -c conda-forge --override-channels "$GEOS_SPEC" $RUNTIME_SPECS
          echo "GEOS_LIB_DIR=$GEOS_ROOT/geos/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GEOS_ROOT/geos/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Locked release build
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN"
        run: cargo build --locked --release
      - name: Package the binary with its GEOS runtime
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/fast-map-prepare-linux-x86_64"
          mkdir -p "$out"
          cp target/release/fast-map-prepare "$out/"
          # GEOS and the C++ runtime it was built against (found through $ORIGIN).
          cp -L "$GEOS_ROOT/geos/lib/libgeos_c.so.1" "$GEOS_ROOT/geos/lib/libgeos.so.3.13.1" \
            "$GEOS_ROOT/geos/lib/libstdc++.so.6" "$GEOS_ROOT/geos/lib/libgcc_s.so.1" "$out/"
          MAMBA_ROOT_PREFIX="$GEOS_ROOT/root" "$GEOS_ROOT/bin/micromamba" list -p "$GEOS_ROOT/geos" > "$out/conda-packages.txt"
          (cd "$out" && env -u LD_LIBRARY_PATH ldd fast-map-prepare > ldd.txt && env -u LD_LIBRARY_PATH ./fast-map-prepare version > version.json && sha256sum fast-map-prepare libgeos_c.so.1 libgeos.so.3.13.1 libstdc++.so.6 libgcc_s.so.1 > SHA256SUMS)
          sha256sum Cargo.lock >> "$out/SHA256SUMS"
          {
            echo "### fast-map-prepare CI build"
            echo
            echo '```'
            cat "$out/SHA256SUMS"
            rustc -V
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fast-map-prepare-linux-x86_64
          path: fast-map-prepare-linux-x86_64/*
          if-no-files-found: error
          retention-days: 90
