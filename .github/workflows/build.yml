name: Qualified engine artifacts
on:
  workflow_call:

permissions:
  contents: read

env:
  FAST_MAP_BUILD_COMMIT: ${{ github.sha }}

jobs:
  rust:
    # CLB self-hosted Slurm runner; pull requests from forks stay GitHub-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64", "clb-ci-linux"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/verify_sources.py
      - run: python scripts/dependency_notices.py --check
      - run: python -m unittest discover -s scripts -p test_sanitize_wheel_sbom.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo test --locked --all-targets
      # Thread budget measured on the optimized executable, as shipped.
      - run: cargo test --release --locked --test thread_budget -- --nocapture
      - run: cargo publish --locked --dry-run
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            self_hosted: '["self-hosted", "Windows", "X64", "clb-ci-windows"]'
            target: x86_64-pc-windows-msvc
            manylinux: auto
            platform: windows-x86_64
          # The Linux wheel stays GitHub-hosted: maturin-action builds manylinux_2_28
          # in Docker, which the CLB Linux runner does not have.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            platform: linux-x86_64
    # Fork pull requests -> GitHub-hosted matrix.os; otherwise the self-hosted labels.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('["{0}"]', matrix.os) || matrix.self_hosted || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Windows builds with pip's maturin, not maturin-action. On the self-hosted Windows
      # image the action fails: it calls `rustc +<toolchain>`, which needs the rustup
      # proxies the image lacks (CARGO_HOME=C:\rust\cargo), and it unpacks with Windows
      # PowerShell 5.1. Same maturin version, toolchain, target and arguments as the action.
      - uses: dtolnay/rust-toolchain@1.99.1
        if: runner.os == 'Windows'
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Put the toolchain's cargo on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo_exe="$(rustup which cargo)"
          cargo_exe="${cargo_exe//\\//}"
          echo "${cargo_exe%/*}" >> "$GITHUB_PATH"
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install maturin==1.15.0
          python -m maturin build --release --locked --out dist-unsanitized --target "${{ matrix.target }}"
      # The rust job measures the optimized executable's thread budget on Linux;
      # this measures it on Windows.
      - name: Thread budget tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --release --locked --test thread_budget --target "${{ matrix.target }}" -- --nocapture
      - uses: PyO3/maturin-action@v1
        if: runner.os != 'Windows'
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.99.1'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: --env FAST_MAP_BUILD_COMMIT
          args: --release --locked --out dist-unsanitized
      - name: Canonicalize SBOM workspace identities and verify wheel integrity
        run: python scripts/sanitize_wheel_sbom.py --input-dir dist-unsanitized --output-dir dist
      - name: Installed wheel smoke and source identity
        shell: bash
        run: |
          python -m pip install --no-deps --no-index --find-links dist ras-commander-fast-map
          python -m pip install numpy==2.3.5 scipy==1.16.3 rasterio==1.4.4
          python tests/smoke_engine_wheel.py
          python .github/scripts/artifact_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
