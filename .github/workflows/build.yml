name: Qualified engine artifacts
on:
  workflow_call:

permissions:
  contents: read

env:
  FAST_MAP_BUILD_COMMIT: ${{ github.sha }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/verify_sources.py
      - run: python scripts/dependency_notices.py --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo test --locked --all-targets
      - run: cargo publish --locked --dry-run
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            platform: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.99.1'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Installed wheel smoke and source identity
        shell: bash
        run: |
          python -m pip install --no-deps --no-index --find-links dist ras-commander-fast-map
          python -m pip install numpy==2.3.5 scipy==1.16.3 rasterio==1.4.4
          python tests/smoke_engine_wheel.py
          python .github/scripts/artifact_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
