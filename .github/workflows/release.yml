name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Qualified tag and synchronized versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          crate = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          wheel = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert crate == wheel
          assert os.environ['TAG_NAME'] == 'v' + crate
          PY
  qualified:
    needs: version
    uses: ./.github/workflows/build.yml
  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install maturin==1.15.0
      - run: python -m maturin sdist --out dist
      - run: cargo package --locked
      - run: cp target/package/*.crate dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error
  github-release:
    needs: [qualified, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.crate > SHA256SUMS
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes 'Standalone native Rust mapping engine. See CHANGELOG.md and the qualification documentation.'
  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: artifacts
      - run: mkdir dist && cp artifacts/*.whl artifacts/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
  crates:
    if: vars.PUBLISH_CRATES == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
