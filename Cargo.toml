[package]
name = "ras-commander-fast-map"
version = "0.10.1"
edition = "2024"
license = "MIT AND BSD-3-Clause"
description = "Native Rust 2D flood inundation mapping: horizontal and sloping surfaces, bounded timesteps and terrain windows"
rust-version = "1.99"
authors = ["CLB Engineering Corporation"]
repository = "https://github.com/gpt-cmdr/ras-commander-fast-map"
homepage = "https://rascommander.info/ras/native-mapping-engine/"
documentation = "https://docs.rs/ras-commander-fast-map"
readme = "README.md"
keywords = ["hec-ras", "flood", "raster", "hydraulics", "mapping"]
categories = ["science", "science::geo"]
include = ["/src/**/*.rs", "/examples/**/*.rs", "/tests/*.rs", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/THIRD_PARTY_NOTICES.md", "/licenses/**", "/MIGRATION.json", "/SOURCE_MANIFEST.json"]

[[bin]]
name = "ras2fim-batch"
path = "src/main.rs"

[dependencies]
# Native terrain and polygon rasterization; GDAL remains disabled.
terrio = { version = "=0.4.2", default-features = false, features = ["geotiff"] }
wbvector = "=0.1.6"
wbraster = "=0.2.1"
clipper2-rust = "=1.2.0"
rayon = "1.10"
rstar = "=0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
